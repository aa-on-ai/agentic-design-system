<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juniper operations</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#222a29;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main,footer{max-width:1160px;margin:auto;padding:24px 32px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #d3d8d3}.brand{font-size:21px;font-weight:700}.section{color:#515c58;margin-left:16px}.demo{font-size:13px;color:#515c58}h1{font-size:36px;line-height:1.2;margin:24px 0 12px;font-weight:650;max-width:800px}h2{font-size:22px;line-height:1.3;margin:0 0 16px}h3{font-size:18px;margin:8px 0}p{margin:8px 0 16px}.sub,.meta{color:#515c58;font-size:14px}.workspace{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:48px;margin-top:32px}.focus{background:#fff;padding:28px;border-radius:8px;border:1px solid #d3d8d3}.kicker{color:var(--accent);font-size:14px;font-weight:650}.focus h2{font-size:27px;margin:12px 0}.tag{display:inline-block;background:#f1eee6;color:#4c473b;border-radius:4px;padding:4px 8px;font-size:13px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button{font:600 15px/1.4 inherit;min-height:48px;padding:12px 18px;border-radius:5px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}button:disabled{color:#5d625f;background:#e0e3df;border-color:#b9c0b9;cursor:not-allowed}button:focus-visible{outline:3px solid #235eaf;outline-offset:3px}.notice{padding:20px 24px;background:#f7e9db;color:#55361f;border:1px solid #d6b18a;border-radius:6px;margin-top:24px}.notice strong{font-size:18px}.sequence{list-style:none;padding:0;margin:0}.sequence li{display:grid;grid-template-columns:65px 1fr;gap:16px;padding:20px 0;border-top:1px solid #d3d8d3}.time{font-variant-numeric:tabular-nums;font-size:14px;font-weight:650;color:var(--accent)}.row-title{font-weight:650}.row-detail{font-size:14px;color:#515c58;margin:4px 0 8px}.row-end{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;font-size:13px}.queue{margin-top:32px}aside{padding-top:4px}dl{margin:0}dt{font-weight:650;margin-top:24px}dd{margin:5px 0 0;color:#515c58;font-size:15px}.state-panel{min-height:280px;padding:36px 0}.state-panel p{max-width:560px}.placeholder{height:18px;background:#dce1dc;border-radius:4px;margin:20px 0;max-width:420px}.feedback{margin:12px 0 0;color:var(--accent);font-weight:550}footer{font-size:13px;color:#515c58;padding-top:32px;padding-bottom:36px}@media(max-width:700px){header,main,footer{padding-left:20px;padding-right:20px}header{align-items:flex-start}.section{display:block;margin:2px 0 0;font-size:14px}.demo{max-width:90px;text-align:right}h1{font-size:29px;margin-top:12px}.workspace{grid-template-columns:1fr;gap:32px;margin-top:24px}.focus{padding:20px}.focus h2{font-size:24px}.actions{flex-direction:column;align-items:stretch}.sequence li{grid-template-columns:52px 1fr;gap:12px}.notice{padding:18px}.row-end{align-items:flex-start}aside{padding-top:0}}.feedback:empty{display:none}.notice p:last-child{margin-bottom:0}.decision-label{font-weight:700;color:var(--accent);margin-top:24px}.action-context{font-size:14px;margin-top:24px;margin-bottom:8px;color:#39453e}.actions{margin-top:12px}.sequence li.exception{background:#eeece4;border:1px solid #bbbfb4;border-radius:6px;padding:16px;margin:10px 0}.flag{display:block;font-weight:700;color:#643b22;background:#f4e8dc;padding:6px 9px;margin:8px 0;border-radius:4px}.sequence li.exception .row-title{font-size:18px}.moisture{margin-top:24px}.moisture>div{display:flex;align-items:baseline;justify-content:space-between}.moisture b{font-size:32px}.moisture meter{width:100%;height:22px}.moisture p{font-size:14px}.object-summary,.broadcast-clock{display:flex;gap:24px;flex-wrap:wrap;margin:24px 0}.object-summary>div,.broadcast-clock>div{flex:1;min-width:110px}.object-summary dt,.broadcast-clock dt{font-size:13px;margin:0}.object-summary dd{font-weight:650}.broadcast-clock dd{font-size:28px;font-variant-numeric:tabular-nums;color:var(--accent)}.service-target{margin:24px 0}.service-target>strong{font-size:20px}.queue-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.queue-heading h2{margin-bottom:0}.queue-heading{margin-bottom:20px}.standalone{max-width:480px}</style></head><body style="--accent:#7b3f28">
<header><div><span class="brand">Juniper</span><span class="section">Service pass</span></div><span class="demo">Local demonstration</span></header><main id="main"></main><footer>Synthetic data. Local interactions only; no operational system is connected.</footer>
<script>const c={"slug": "kitchen-pass", "brand": "Juniper", "section": "Service pass", "title": "Table 12 is cleared for dessert.", "sub": "Dinner service / Wednesday 11 November", "accent": "#7b3f28", "kicker": "Next fire / dessert at 19:42", "focus": "Table 12, four covers", "body": "The fish course has left the pass and the runner confirmed clearance at 19:41. Fire dessert for table 12 next; keep one portion dairy-free.", "tag": "Runner confirmed / dessert next", "listtitle": "Pacing the room", "col": "Table / course", "rows": [["19:42", "Table 12 / dessert", "4 covers / 1 dairy-free", "Pastry / ready now", "Cleared to fire"], ["19:46", "Table 8 / vegetables", "2 covers / no modifications", "Garden / 2 min to plate", "2 min to plate"], ["19:52", "Table 5 / main", "3 covers / 1 nut allergy", "Grill / held 4 min", "Hold for clearance"]], "aside": "Station readiness", "notes": [["Pastry", "Ready / table 12 dessert"], ["Garden", "Finishing / 2 minutes"], ["Grill", "Hold / table 5 clearance needed"]], "restricted": "Fire next course", "preserved": "Call station", "error": "Order feed offline", "errorbody": "The pass last synced at 19:42. Firing is disabled until the feed returns. Call the station to coordinate manually; the queue below may be stale.", "empty": "The pass is clear", "emptybody": "No open tables are waiting for a course. New tickets will appear when the order feed sends them.", "loading": "Syncing the service pass", "contact": "Station contact / Pastry / kitchen extension 14. Synthetic fixture; no call placed.", "errorTitle": "Pass last synced at 19:42. Confirm first.", "status": "Service snapshot / 19:42", "errorStatus": "Order feed offline / table status may have changed", "emptyContext": "Dinner service / pass clear", "emptyStatus": "No open courses on the pass", "loadingCopy": "Syncing table tickets, dietary notes and station readiness for dinner service.", "emptyAction": "Open sample service", "target": "Next fire is dessert for table 12, four covers, one dairy-free. Call station reaches the pastry station.", "domain": "<div class=\"service-target\"><strong>Dessert for table 12</strong><span class=\"flag\">Dietary / one dairy-free</span><p>Fish cleared 1 min ago / pastry ready to fire</p></div>", "errorFocusBody": "At the 19:42 snapshot, the runner had confirmed clearance at 19:41. This is last-known information; call pastry to confirm the table before firing.", "errorTarget": "Firing is paused. Call station reaches pastry to confirm table 12 and its dairy-free portion."};const main=document.getElementById('main');
function render(){const state=new URLSearchParams(location.hash.slice(1)).get('state')||'default';const error=state==='error';
const actions=`<div class="actions header-actions"><button data-action="primary" ${error?'disabled aria-describedby="restriction"':''}>Fire next course</button><button class="secondary" data-action="contact">Call station</button></div>`;
main.innerHTML=`<p class="sub">${state==='empty'?c.emptyContext:c.sub}</p><h1>${state==='loading'?c.loading:state==='empty'?c.empty:error?c.errorTitle:c.title}</h1><div id="status" role="status" aria-live="polite"><span class="meta">${state==='loading'?c.loadingCopy:error?c.errorStatus:state==='empty'?c.emptyStatus:c.status}</span></div>${error?`<section class="notice" role="alert" aria-live="assertive"><strong>${c.error}</strong><p id="restriction">${c.errorbody}</p></section>`:''}${state==='loading'?`<section class="state-panel" aria-busy="true"><div class="placeholder" aria-hidden="true"></div><div class="placeholder" style="max-width:280px" aria-hidden="true"></div></section>`:state==='empty'?`<section class="state-panel"><p>${c.emptybody}</p><div class="header-actions standalone"><button data-action="open-sample">${c.emptyAction}</button></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p></section>`:`<div class="workspace"><section><div class="focus"><span class="kicker">${c.kicker}${error?" / last confirmed":""}</span><h2>${c.focus}</h2><p>${error?c.errorFocusBody:c.body}</p><span class="tag">${c.tag}</span><div class="service-target"><strong>Dessert for table 12</strong><span class="flag">Dietary / one dairy-free</span><p>${error?'Last-known clearance 19:41 / verify with pastry':'Fish cleared 1 min ago / pastry ready to fire'}</p></div><p class="action-context">${error?c.errorTarget:c.target}</p>${actions}<p class="feedback" id="feedback" role="status" aria-live="polite"></p></div><section class="queue" aria-label="${c.listtitle}"><div class="queue-heading"><h2>${c.listtitle}</h2></div><ol class="sequence"><li class="routine"><span class="time">19:42</span><div><div class="row-title">Table 12 / dessert</div><p class="row-detail">4 covers</p><strong class="flag">Dietary / 1 dairy-free</strong><div class="row-end"><span>Pastry / ready now</span><span class="tag">${error?'Last-known clearance / confirm':'Cleared to fire'}</span></div></div></li><li class="routine"><span class="time">19:46</span><div><div class="row-title">Table 8 / vegetables</div><p class="row-detail">2 covers / no modifications</p><div class="row-end"><span>Garden / 2 min to plate</span><span class="tag">2 min to plate</span></div></div></li><li class="exception"><span class="time">19:52</span><div><div class="row-title">Table 5 / main</div><p class="row-detail">3 covers</p><strong class="flag">Allergy / nuts</strong><strong class="flag">Hold / do not fire until cleared</strong><div class="row-end"><span>Grill / held 4 min</span><span class="tag">Hold for clearance</span></div></div></li></ol></section></section><aside><h2>${c.aside}</h2><dl>${c.notes.map(n=>`<dt>${n[0]}</dt><dd>${n[1]}</dd>`).join('')}</dl></aside></div>`}`;
main.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;if(b.dataset.action==='open-sample'){location.hash='state=default';return;}const primary=b.dataset.action==='primary'||b.dataset.action==='new-walk';let message=primary?`${c.restricted} selected in this local demonstration. No operational change was saved.`:c.contact;document.getElementById('feedback').textContent=message;}));}window.addEventListener('hashchange',render);render();</script></body></html>
