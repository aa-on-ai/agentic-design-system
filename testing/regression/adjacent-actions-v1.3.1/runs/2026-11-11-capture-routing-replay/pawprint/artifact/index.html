<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pawprint operations</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#222a29;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main,footer{max-width:1160px;margin:auto;padding:24px 32px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #d3d8d3}.brand{font-size:21px;font-weight:700}.section{color:#515c58;margin-left:16px}.demo{font-size:13px;color:#515c58}h1{font-size:36px;line-height:1.2;margin:24px 0 12px;font-weight:650;max-width:800px}h2{font-size:22px;line-height:1.3;margin:0 0 16px}h3{font-size:18px;margin:8px 0}p{margin:8px 0 16px}.sub,.meta{color:#515c58;font-size:14px}.workspace{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:48px;margin-top:32px}.focus{background:#fff;padding:28px;border-radius:8px;border:1px solid #d3d8d3}.kicker{color:var(--accent);font-size:14px;font-weight:650}.focus h2{font-size:27px;margin:12px 0}.tag{display:inline-block;background:#f1eee6;color:#4c473b;border-radius:4px;padding:4px 8px;font-size:13px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button{font:600 15px/1.4 inherit;min-height:48px;padding:12px 18px;border-radius:5px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}button:disabled{color:#5d625f;background:#e0e3df;border-color:#b9c0b9;cursor:not-allowed}button:focus-visible{outline:3px solid #235eaf;outline-offset:3px}.notice{padding:20px 24px;background:#f7e9db;color:#55361f;border:1px solid #d6b18a;border-radius:6px;margin-top:24px}.notice strong{font-size:18px}.sequence{list-style:none;padding:0;margin:0}.sequence li{display:grid;grid-template-columns:65px 1fr;gap:16px;padding:20px 0;border-top:1px solid #d3d8d3}.time{font-variant-numeric:tabular-nums;font-size:14px;font-weight:650;color:var(--accent)}.row-title{font-weight:650}.row-detail{font-size:14px;color:#515c58;margin:4px 0 8px}.row-end{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;font-size:13px}.queue{margin-top:32px}aside{padding-top:4px}dl{margin:0}dt{font-weight:650;margin-top:24px}dd{margin:5px 0 0;color:#515c58;font-size:15px}.state-panel{min-height:280px;padding:36px 0}.state-panel p{max-width:560px}.placeholder{height:18px;background:#dce1dc;border-radius:4px;margin:20px 0;max-width:420px}.feedback{margin:12px 0 0;color:var(--accent);font-weight:550}footer{font-size:13px;color:#515c58;padding-top:32px;padding-bottom:36px}@media(max-width:700px){header,main,footer{padding-left:20px;padding-right:20px}header{align-items:flex-start}.section{display:block;margin:2px 0 0;font-size:14px}.demo{max-width:90px;text-align:right}h1{font-size:29px;margin-top:12px}.workspace{grid-template-columns:1fr;gap:32px;margin-top:24px}.focus{padding:20px}.focus h2{font-size:24px}.actions{flex-direction:column;align-items:stretch}.sequence li{grid-template-columns:52px 1fr;gap:12px}.notice{padding:18px}.row-end{align-items:flex-start}aside{padding-top:0}}.feedback:empty{display:none}.notice p:last-child{margin-bottom:0}.decision-label{font-weight:700;color:var(--accent);margin-top:24px}.action-context{font-size:14px;margin-top:24px;margin-bottom:8px;color:#39453e}.actions{margin-top:12px}.sequence li.exception{background:#eeece4;border:1px solid #bbbfb4;border-radius:6px;padding:16px;margin:10px 0}.flag{display:block;font-weight:700;color:#643b22;background:#f4e8dc;padding:6px 9px;margin:8px 0;border-radius:4px}.sequence li.exception .row-title{font-size:18px}.moisture{margin-top:24px}.moisture>div{display:flex;align-items:baseline;justify-content:space-between}.moisture b{font-size:32px}.moisture meter{width:100%;height:22px}.moisture p{font-size:14px}.object-summary,.broadcast-clock{display:flex;gap:24px;flex-wrap:wrap;margin:24px 0}.object-summary>div,.broadcast-clock>div{flex:1;min-width:110px}.object-summary dt,.broadcast-clock dt{font-size:13px;margin:0}.object-summary dd{font-weight:650}.broadcast-clock dd{font-size:28px;font-variant-numeric:tabular-nums;color:var(--accent)}.service-target{margin:24px 0}.service-target>strong{font-size:20px}.queue-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.queue-heading h2{margin-bottom:0}.queue-heading{margin-bottom:20px}.standalone{max-width:480px}</style></head><body style="--accent:#235b49">
<header><div><span class="brand">Pawprint</span><span class="section">Dispatch</span></div><span class="demo">Local demonstration</span></header><main id="main"></main><footer>Synthetic data. Local interactions only; no operational system is connected.</footer>
<script>const c={"slug": "pawprint", "brand": "Pawprint", "section": "Dispatch", "title": "Three walks. One route to confirm.", "sub": "Wednesday 11 November / Venice team", "accent": "#235b49", "kicker": "Next departure / 10:30", "focus": "Archie needs a quieter route", "body": "Use the canal loop today. Construction on Pacific makes the usual crossing unsuitable for a nervous dog.", "tag": "Route change", "listtitle": "Today’s walks", "col": "Booking / route", "rows": [["10:30", "Archie + Mabel", "Canal loop / 45 minutes", "Mina Patel", "Route change"], ["11:00", "Otis", "Oakwood park / 30 minutes", "Jules Kim", "Ready"], ["11:30", "Frankie + Roo", "Beach path / 45 minutes", "Sam Rivera", "Confirmed"]], "aside": "Walker coverage", "notes": [["Mina Patel", "1 walk / canal route to confirm"], ["Jules Kim", "1 walk / available after 11:45"], ["Sam Rivera", "1 walk / first departure 11:30"]], "restricted": "New walk", "preserved": "Retry", "error": "Schedule read-only", "errorbody": "The booking service is unavailable. New walks are paused. Retry to reconnect; existing assignments below are last confirmed at 10:12.", "empty": "No walks scheduled", "emptybody": "The team is available. Add the first walk when a booking is confirmed.", "loading": "Loading today’s walks", "contact": "Connection retried in this local demonstration. No live booking service is connected.", "errorTitle": "Reconnect before changing walks.", "status": "Dispatch snapshot / 10:12", "errorStatus": "Schedule read-only / assignments last confirmed 10:12", "emptyContext": "Venice team / booking queue", "emptyStatus": "No bookings for today", "loadingCopy": "Checking bookings, walker availability and route notes for the Venice team.", "emptyAction": "New walk", "target": "New walk starts a local booking draft. Existing route decisions are separate.", "domain": "<p class=\"decision-label\">Route decision</p><p>Confirm the canal loop with Mina before the 10:30 departure.</p><button data-action=\"route\">Confirm canal route</button>"};const main=document.getElementById('main');
function render(){const state=new URLSearchParams(location.hash.slice(1)).get('state')||'default';const error=state==='error';
const actions=`<div class="actions header-actions"><button data-action="new-walk" ${error?'disabled aria-describedby="restriction"':''}>New walk</button>${error?`<button class="secondary" data-action="retry">Retry</button>`:''}</div>`;
main.innerHTML=`<p class="sub">${state==='empty'?c.emptyContext:c.sub}</p><h1>${state==='loading'?c.loading:state==='empty'?c.empty:error?c.errorTitle:c.title}</h1><div id="status" role="status" aria-live="polite"><span class="meta">${state==='loading'?c.loadingCopy:error?c.errorStatus:state==='empty'?c.emptyStatus:c.status}</span></div>${error?`<section class="notice" role="alert" aria-live="assertive"><strong>${c.error}</strong><p id="restriction">${c.errorbody}</p></section>`:''}${state==='loading'?`<section class="state-panel" aria-busy="true"><div class="placeholder" aria-hidden="true"></div><div class="placeholder" style="max-width:280px" aria-hidden="true"></div></section>`:state==='empty'?`<section class="state-panel"><p>${c.emptybody}</p><div class="header-actions standalone"><button data-action="new-walk">${c.emptyAction}</button></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p></section>`:`<div class="workspace"><section><div class="focus"><span class="kicker">${c.kicker}${error?" / last confirmed":""}</span><h2>${c.focus}</h2><p>${c.body}</p><span class="tag">${c.tag}</span><p class="decision-label">Route decision</p><p>Confirm the canal loop with Mina before the 10:30 departure.</p><button data-action="route">Contact Mina</button><p class="feedback" id="feedback" role="status" aria-live="polite"></p></div><section class="queue" aria-label="${c.listtitle}"><div class="queue-heading"><h2>${c.listtitle}</h2>${actions}</div><ol class="sequence"><li class="exception"><span class="time">10:30</span><div><div class="row-title">Archie + Mabel</div><p class="row-detail">Canal loop / 45 minutes</p><div class="row-end"><span>Mina Patel</span><span class="tag">Route change</span></div></div></li><li class="routine"><span class="time">11:00</span><div><div class="row-title">Otis</div><p class="row-detail">Oakwood park / 30 minutes</p><div class="row-end"><span>Jules Kim</span><span class="tag">Ready</span></div></div></li><li class="routine"><span class="time">11:30</span><div><div class="row-title">Frankie + Roo</div><p class="row-detail">Beach path / 45 minutes</p><div class="row-end"><span>Sam Rivera</span><span class="tag">Confirmed</span></div></div></li></ol></section></section><aside><h2>${c.aside}</h2><dl>${c.notes.map(n=>`<dt>${n[0]}</dt><dd>${n[1]}</dd>`).join('')}</dl></aside></div>`}`;
main.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;if(b.dataset.action==='open-sample'){location.hash='state=default';return;}const primary=b.dataset.action==='primary'||b.dataset.action==='new-walk';let message=primary?`${c.restricted} selected in this local demonstration. No operational change was saved.`:c.contact;if(b.dataset.action==='route')message='Walker contact / Mina Patel / team extension 11. Discuss the canal route before departure. Synthetic fixture; no call placed.';document.getElementById('feedback').textContent=message;}));}window.addEventListener('hashchange',render);render();</script></body></html>
