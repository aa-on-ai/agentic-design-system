<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glasshouse operations</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#222a29;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main,footer{max-width:1160px;margin:auto;padding:24px 32px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #d3d8d3}.brand{font-size:21px;font-weight:700}.section{color:#515c58;margin-left:16px}.demo{font-size:13px;color:#515c58}h1{font-size:36px;line-height:1.2;margin:24px 0 12px;font-weight:650;max-width:800px}h2{font-size:22px;line-height:1.3;margin:0 0 16px}h3{font-size:18px;margin:8px 0}p{margin:8px 0 16px}.sub,.meta{color:#515c58;font-size:14px}.workspace{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:48px;margin-top:32px}.focus{background:#fff;padding:28px;border-radius:8px;border:1px solid #d3d8d3}.kicker{color:var(--accent);font-size:14px;font-weight:650}.focus h2{font-size:27px;margin:12px 0}.tag{display:inline-block;background:#f1eee6;color:#4c473b;border-radius:4px;padding:4px 8px;font-size:13px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button{font:600 15px/1.4 inherit;min-height:48px;padding:12px 18px;border-radius:5px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}button:disabled{color:#5d625f;background:#e0e3df;border-color:#b9c0b9;cursor:not-allowed}button:focus-visible{outline:3px solid #235eaf;outline-offset:3px}.notice{padding:20px 24px;background:#f7e9db;color:#55361f;border:1px solid #d6b18a;border-radius:6px;margin-top:24px}.notice strong{font-size:18px}.sequence{list-style:none;padding:0;margin:0}.sequence li{display:grid;grid-template-columns:65px 1fr;gap:16px;padding:20px 0;border-top:1px solid #d3d8d3}.time{font-variant-numeric:tabular-nums;font-size:14px;font-weight:650;color:var(--accent)}.row-title{font-weight:650}.row-detail{font-size:14px;color:#515c58;margin:4px 0 8px}.row-end{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;font-size:13px}.queue{margin-top:32px}aside{padding-top:4px}dl{margin:0}dt{font-weight:650;margin-top:24px}dd{margin:5px 0 0;color:#515c58;font-size:15px}.state-panel{min-height:280px;padding:36px 0}.state-panel p{max-width:560px}.placeholder{height:18px;background:#dce1dc;border-radius:4px;margin:20px 0;max-width:420px}.feedback{margin:12px 0 0;color:var(--accent);font-weight:550}footer{font-size:13px;color:#515c58;padding-top:32px;padding-bottom:36px}@media(max-width:700px){header,main,footer{padding-left:20px;padding-right:20px}header{align-items:flex-start}.section{display:block;margin:2px 0 0;font-size:14px}.demo{max-width:90px;text-align:right}h1{font-size:29px;margin-top:12px}.workspace{grid-template-columns:1fr;gap:32px;margin-top:24px}.focus{padding:20px}.focus h2{font-size:24px}.actions{flex-direction:column;align-items:stretch}.sequence li{grid-template-columns:52px 1fr;gap:12px}.notice{padding:18px}.row-end{align-items:flex-start}aside{padding-top:0}}.feedback:empty{display:none}.notice p:last-child{margin-bottom:0}.decision-label{font-weight:700;color:var(--accent);margin-top:24px}.action-context{font-size:14px;margin-top:24px;margin-bottom:8px;color:#39453e}.actions{margin-top:12px}.sequence li.exception{background:#eeece4;border:1px solid #bbbfb4;border-radius:6px;padding:16px;margin:10px 0}.flag{display:block;font-weight:700;color:#643b22;background:#f4e8dc;padding:6px 9px;margin:8px 0;border-radius:4px}.sequence li.exception .row-title{font-size:18px}.moisture{margin-top:24px}.moisture>div{display:flex;align-items:baseline;justify-content:space-between}.moisture b{font-size:32px}.moisture meter{width:100%;height:22px}.moisture p{font-size:14px}.object-summary,.broadcast-clock{display:flex;gap:24px;flex-wrap:wrap;margin:24px 0}.object-summary>div,.broadcast-clock>div{flex:1;min-width:110px}.object-summary dt,.broadcast-clock dt{font-size:13px;margin:0}.object-summary dd{font-weight:650}.broadcast-clock dd{font-size:28px;font-variant-numeric:tabular-nums;color:var(--accent)}.service-target{margin:24px 0}.service-target>strong{font-size:20px}.queue-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.queue-heading h2{margin-bottom:0}.queue-heading{margin-bottom:20px}.standalone{max-width:480px}</style></head><body style="--accent:#3c5d2f">
<header><div><span class="brand">Glasshouse</span><span class="section">Irrigation</span></div><span class="demo">Local demonstration</span></header><main id="main"></main><footer>Synthetic data. Local interactions only; no operational system is connected.</footer>
<script>const c={"slug": "greenhouse-irrigation", "brand": "Glasshouse", "section": "Irrigation", "title": "Give zone 3 the next run.", "sub": "North house / Wednesday 11 November", "accent": "#3c5d2f", "kicker": "Next watering / 11:20", "focus": "Propagation is drying faster", "body": "Zone 3 is at 28% substrate moisture, below its 32–40% target. Check the feed line before the six-minute pulse.", "tag": "Below target", "listtitle": "Watering sequence", "col": "Zone / crop", "rows": [["11:20", "Zone 3 / propagation", "28% moisture / target 32–40%", "6 min pulse", "Check feed line"], ["11:35", "Zone 1 / tomatoes", "41% moisture / target 38–46%", "8 min pulse", "On target"], ["11:50", "Zone 2 / herbs", "35% moisture / target 32–40%", "4 min pulse", "On target"]], "aside": "Before the next run", "notes": [["Feed line inspection", "Assigned to Leila / due 11:15"], ["Reservoir", "Last manual check at 10:45"], ["Grower on duty", "Leila Haddad / extension 204"]], "restricted": "Adjust schedule", "preserved": "Call grower", "error": "Telemetry offline / safe mode", "errorbody": "Live readings stopped at 11:04. Schedule changes are disabled. Values below are last known; call the grower to confirm conditions before watering.", "empty": "No watering runs planned", "emptybody": "No zones are assigned to this shift. Confirm the crop plan before scheduling irrigation.", "loading": "Reading zone telemetry", "contact": "Grower contact / Leila Haddad / extension 204. Synthetic contact details; no call placed.", "errorTitle": "Confirm conditions before watering.", "status": "Telemetry snapshot / 11:04", "errorStatus": "Safe mode / readings last received 11:04", "emptyContext": "North house / irrigation plan", "emptyStatus": "No zones assigned to this shift", "loadingCopy": "Reading substrate sensors and checking the planned watering sequence for the north house.", "emptyAction": "Open sample zone plan", "target": "Adjust the six-minute pulse for zone 3. Grower contact is Leila, extension 204.", "domain": "<div class=\"moisture\"><strong>Zone 3 moisture</strong><div><b>28%</b><span>Target 32–40%</span></div><meter min=\"0\" max=\"100\" low=\"32\" high=\"40\" optimum=\"36\" value=\"28\" aria-label=\"Zone 3 moisture 28 percent, target 32 to 40 percent\"></meter><p>4 percentage points below the target minimum</p></div>"};const main=document.getElementById('main');
function render(){const state=new URLSearchParams(location.hash.slice(1)).get('state')||'default';const error=state==='error';
const actions=`<div class="actions header-actions"><button data-action="primary" ${error?'disabled aria-describedby="restriction"':''}>Adjust schedule</button><button class="secondary" data-action="contact">Call grower</button></div>`;
main.innerHTML=`<p class="sub">${state==='empty'?c.emptyContext:c.sub}</p><h1>${state==='loading'?c.loading:state==='empty'?c.empty:error?c.errorTitle:c.title}</h1><div id="status" role="status" aria-live="polite"><span class="meta">${state==='loading'?c.loadingCopy:error?c.errorStatus:state==='empty'?c.emptyStatus:c.status}</span></div>${error?`<section class="notice" role="alert" aria-live="assertive"><strong>${c.error}</strong><p id="restriction">${c.errorbody}</p></section>`:''}${state==='loading'?`<section class="state-panel" aria-busy="true"><div class="placeholder" aria-hidden="true"></div><div class="placeholder" style="max-width:280px" aria-hidden="true"></div></section>`:state==='empty'?`<section class="state-panel"><p>${c.emptybody}</p><div class="header-actions standalone"><button data-action="open-sample">${c.emptyAction}</button></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p></section>`:`<div class="workspace"><section><div class="focus"><span class="kicker">${c.kicker}${error?" / last confirmed":""}</span><h2>${c.focus}</h2><p>${c.body}</p><span class="tag">${c.tag}</span><div class="moisture"><strong>Zone 3 moisture</strong><div><b>28%</b><span>Target 32–40%</span></div><meter min="0" max="100" low="32" high="40" optimum="36" value="28" aria-label="Zone 3 moisture 28 percent, target 32 to 40 percent"></meter><p>4 percentage points below the target minimum</p></div><p class="action-context">${c.target}</p>${actions}<p class="feedback" id="feedback" role="status" aria-live="polite"></p></div><section class="queue" aria-label="${c.listtitle}"><div class="queue-heading"><h2>${c.listtitle}</h2></div><ol class="sequence"><li class="exception"><span class="time">11:20</span><div><div class="row-title">Zone 3 / propagation</div><p class="row-detail">28% moisture / target 32–40%</p><strong>Below target / inspect feed line</strong><div class="row-end"><span>6 min pulse</span><span class="tag">Check feed line</span></div></div></li><li class="routine"><span class="time">11:35</span><div><div class="row-title">Zone 1 / tomatoes</div><p class="row-detail">41% moisture / target 38–46%</p><div class="row-end"><span>8 min pulse</span><span class="tag">On target</span></div></div></li><li class="routine"><span class="time">11:50</span><div><div class="row-title">Zone 2 / herbs</div><p class="row-detail">35% moisture / target 32–40%</p><div class="row-end"><span>4 min pulse</span><span class="tag">On target</span></div></div></li></ol></section></section><aside><h2>${c.aside}</h2><dl>${c.notes.map(n=>`<dt>${n[0]}</dt><dd>${n[1]}</dd>`).join('')}</dl></aside></div>`}`;
main.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;if(b.dataset.action==='open-sample'){location.hash='state=default';return;}const primary=b.dataset.action==='primary'||b.dataset.action==='new-walk';let message=primary?`${c.restricted} selected in this local demonstration. No operational change was saved.`:c.contact;document.getElementById('feedback').textContent=message;}));}window.addEventListener('hashchange',render);render();</script></body></html>
