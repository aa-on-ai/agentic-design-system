<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldwork Museum operations</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#222a29;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main,footer{max-width:1160px;margin:auto;padding:24px 32px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #d3d8d3}.brand{font-size:21px;font-weight:700}.section{color:#515c58;margin-left:16px}.demo{font-size:13px;color:#515c58}h1{font-size:36px;line-height:1.2;margin:24px 0 12px;font-weight:650;max-width:800px}h2{font-size:22px;line-height:1.3;margin:0 0 16px}h3{font-size:18px;margin:8px 0}p{margin:8px 0 16px}.sub,.meta{color:#515c58;font-size:14px}.workspace{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:48px;margin-top:32px}.focus{background:#fff;padding:28px;border-radius:8px;border:1px solid #d3d8d3}.kicker{color:var(--accent);font-size:14px;font-weight:650}.focus h2{font-size:27px;margin:12px 0}.tag{display:inline-block;background:#f1eee6;color:#4c473b;border-radius:4px;padding:4px 8px;font-size:13px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button{font:600 15px/1.4 inherit;min-height:48px;padding:12px 18px;border-radius:5px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}button:disabled{color:#5d625f;background:#e0e3df;border-color:#b9c0b9;cursor:not-allowed}button:focus-visible{outline:3px solid #235eaf;outline-offset:3px}.notice{padding:20px 24px;background:#f7e9db;color:#55361f;border:1px solid #d6b18a;border-radius:6px;margin-top:24px}.notice strong{font-size:18px}.sequence{list-style:none;padding:0;margin:0}.sequence li{display:grid;grid-template-columns:65px 1fr;gap:16px;padding:20px 0;border-top:1px solid #d3d8d3}.time{font-variant-numeric:tabular-nums;font-size:14px;font-weight:650;color:var(--accent)}.row-title{font-weight:650}.row-detail{font-size:14px;color:#515c58;margin:4px 0 8px}.row-end{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;font-size:13px}.queue{margin-top:32px}aside{padding-top:4px}dl{margin:0}dt{font-weight:650;margin-top:24px}dd{margin:5px 0 0;color:#515c58;font-size:15px}.state-panel{min-height:280px;padding:36px 0}.state-panel p{max-width:560px}.placeholder{height:18px;background:#dce1dc;border-radius:4px;margin:20px 0;max-width:420px}.feedback{margin:12px 0 0;color:var(--accent);font-weight:550}footer{font-size:13px;color:#515c58;padding-top:32px;padding-bottom:36px}@media(max-width:700px){header,main,footer{padding-left:20px;padding-right:20px}header{align-items:flex-start}.section{display:block;margin:2px 0 0;font-size:14px}.demo{max-width:90px;text-align:right}h1{font-size:29px;margin-top:12px}.workspace{grid-template-columns:1fr;gap:32px;margin-top:24px}.focus{padding:20px}.focus h2{font-size:24px}.actions{flex-direction:column;align-items:stretch}.sequence li{grid-template-columns:52px 1fr;gap:12px}.notice{padding:18px}.row-end{align-items:flex-start}aside{padding-top:0}}.feedback:empty{display:none}.notice p:last-child{margin-bottom:0}.decision-label{font-weight:700;color:var(--accent);margin-top:24px}.action-context{font-size:14px;margin-top:24px;margin-bottom:8px;color:#39453e}.actions{margin-top:12px}.sequence li.exception{background:#eeece4;border:1px solid #bbbfb4;border-radius:6px;padding:16px;margin:10px 0}.flag{display:block;font-weight:700;color:#643b22;background:#f4e8dc;padding:6px 9px;margin:8px 0;border-radius:4px}.sequence li.exception .row-title{font-size:18px}.moisture{margin-top:24px}.moisture>div{display:flex;align-items:baseline;justify-content:space-between}.moisture b{font-size:32px}.moisture meter{width:100%;height:22px}.moisture p{font-size:14px}.object-summary,.broadcast-clock{display:flex;gap:24px;flex-wrap:wrap;margin:24px 0}.object-summary>div,.broadcast-clock>div{flex:1;min-width:110px}.object-summary dt,.broadcast-clock dt{font-size:13px;margin:0}.object-summary dd{font-weight:650}.broadcast-clock dd{font-size:28px;font-variant-numeric:tabular-nums;color:var(--accent)}.service-target{margin:24px 0}.service-target>strong{font-size:20px}.queue-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.queue-heading h2{margin-bottom:0}.queue-heading{margin-bottom:20px}.standalone{max-width:480px}</style></head><body style="--accent:#694a38">
<header><div><span class="brand">Fieldwork Museum</span><span class="section">Loan registrar</span></div><span class="demo">Local demonstration</span></header><main id="main"></main><footer>Synthetic data. Local interactions only; no operational system is connected.</footer>
<script>const c={"slug": "museum-loans", "brand": "Fieldwork Museum", "section": "Loan registrar", "title": "One final check before departure.", "sub": "Loan 2026-041 / Fieldwork to Harbor Museum", "accent": "#694a38", "kicker": "Transfer / 14 November", "focus": "Ceramic vessel, circa 1920", "body": "A hairline crack at the rim is stable. The condition report and custom foam cradle must travel with the object.", "tag": "Fragile / stable condition", "listtitle": "Custody milestones", "col": "Milestone / evidence", "rows": [["11 Nov", "Condition documented", "Report CR-041 / 8 reference photographs", "N. Chen", "Complete"], ["12 Nov", "Crate and cushion", "Custom cradle / crate FM-208", "Art handling", "In progress"], ["14 Nov", "Courier handoff", "Harbor Museum loading bay / 09:00", "E. Wallace", "Awaiting approval"]], "aside": "Object record", "notes": [["Accession", "FM.1984.027 / ceramic"], ["Packed dimensions", "48 × 42 × 58 cm / upright"], ["Receiving registrar", "Elena Wallace / Harbor Museum"]], "restricted": "Approve transfer", "preserved": "Download condition report", "error": "Approval permission required", "errorbody": "Your registrar role can inspect records but cannot approve this transfer. Ask the collections lead to approve; the condition report remains available.", "empty": "No loan selected", "emptybody": "Open the sample loan to inspect its condition and custody record. No loan is selected in this view.", "loading": "Opening the loan record", "contact": "Condition report prepared for local download.", "errorTitle": "Approval belongs to the collections lead.", "status": "Current loan record / registrar workspace", "errorStatus": "Read access active / collections lead approval required", "emptyContext": "Loan register / no selection", "emptyStatus": "Choose an object loan to inspect", "loadingCopy": "Opening the accession record, condition report and custody milestones for loan 2026-041.", "emptyAction": "Open sample loan", "target": "Approve loan 2026-041 for the 14 November courier handoff. Condition evidence remains available.", "domain": "<dl class=\"object-summary\"><div><dt>Accession</dt><dd>FM.1984.027</dd></div><div><dt>Condition</dt><dd>Stable rim crack</dd></div><div><dt>Packing</dt><dd>Custom cradle required</dd></div></dl>"};const main=document.getElementById('main');
function render(){const state=new URLSearchParams(location.hash.slice(1)).get('state')||'default';const error=state==='error';
const actions=`<div class="actions header-actions"><button data-action="primary" ${error?'disabled aria-describedby="restriction"':''}>Approve transfer</button><button class="secondary" data-action="contact">Download condition report</button></div>`;
main.innerHTML=`<p class="sub">${state==='empty'?c.emptyContext:c.sub}</p><h1>${state==='loading'?c.loading:state==='empty'?c.empty:error?c.errorTitle:c.title}</h1><div id="status" role="status" aria-live="polite"><span class="meta">${state==='loading'?c.loadingCopy:error?c.errorStatus:state==='empty'?c.emptyStatus:c.status}</span></div>${error?`<section class="notice" role="alert" aria-live="assertive"><strong>${c.error}</strong><p id="restriction">${c.errorbody}</p></section>`:''}${state==='loading'?`<section class="state-panel" aria-busy="true"><div class="placeholder" aria-hidden="true"></div><div class="placeholder" style="max-width:280px" aria-hidden="true"></div></section>`:state==='empty'?`<section class="state-panel"><p>${c.emptybody}</p><div class="header-actions standalone"><button data-action="open-sample">${c.emptyAction}</button></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p></section>`:`<div class="workspace"><section><div class="focus"><span class="kicker">${c.kicker}</span><h2>${c.focus}</h2><p>${c.body}</p><span class="tag">${c.tag}</span><dl class="object-summary"><div><dt>Accession</dt><dd>FM.1984.027</dd></div><div><dt>Condition</dt><dd>Stable rim crack</dd></div><div><dt>Packing</dt><dd>Custom cradle required</dd></div></dl><p class="action-context">${c.target}</p>${actions}<p class="feedback" id="feedback" role="status" aria-live="polite"></p></div><section class="queue" aria-label="${c.listtitle}"><div class="queue-heading"><h2>${c.listtitle}</h2></div><ol class="sequence"><li class="routine"><span class="time">11 Nov</span><div><div class="row-title">Condition documented</div><p class="row-detail">Report CR-041 / 8 reference photographs</p><div class="row-end"><span>N. Chen</span><span class="tag">Complete</span></div></div></li><li class="routine"><span class="time">12 Nov</span><div><div class="row-title">Crate and cushion</div><p class="row-detail">Custom cradle / crate FM-208</p><div class="row-end"><span>Art handling</span><span class="tag">In progress</span></div></div></li><li class="routine"><span class="time">14 Nov</span><div><div class="row-title">Courier handoff</div><p class="row-detail">Harbor Museum loading bay / 09:00</p><div class="row-end"><span>E. Wallace</span><span class="tag">Awaiting approval</span></div></div></li></ol></section></section><aside><h2>${c.aside}</h2><dl>${c.notes.map(n=>`<dt>${n[0]}</dt><dd>${n[1]}</dd>`).join('')}</dl></aside></div>`}`;
main.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;if(b.dataset.action==='open-sample'){location.hash='state=default';return;}const primary=b.dataset.action==='primary'||b.dataset.action==='new-walk';let message=primary?`${c.restricted} selected in this local demonstration. No operational change was saved.`:c.contact;document.getElementById('feedback').textContent=message;if(!primary){const blob=new Blob(['Synthetic condition report CR-041\nFM.1984.027\nHairline rim crack stable. Custom foam cradle required.'],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='condition-report-CR-041.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}}));}window.addEventListener('hashchange',render);render();</script></body></html>
